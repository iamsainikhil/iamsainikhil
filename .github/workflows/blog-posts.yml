name: Blog Posts
on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
jobs:
  update-blog-posts:
    runs-on: ubuntu-latest
    if: "github.repository == 'iamsainikhil/iamsainikhil'"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Fetch latest blog posts
        run: |
          curl -sL "https://blog.iamsainikhil.com" -o blog.html
          node -e "
          const fs = require('fs');
          const content = fs.readFileSync('blog.html', 'utf8');
          const articles = new Map();

          const urlRegex = /href=\"(\/article\/[^\"]+)\"/g;
          const titleRegex = /<a[^>]*class=\"css-1svw4um\"[^>]*>([^<]+)<\/a>/g;

          const urls = [];
          let m;
          while ((m = urlRegex.exec(content)) !== null) {
              if (!urls.includes(m[1])) urls.push(m[1]);
          }

          const titles = [];
          while ((m = titleRegex.exec(content)) !== null) {
              titles.push(m[1].trim());
          }

          for (let i = 0; i < urls.length; i++) {
              if (titles[i] && !titles[i].includes('Read Full')) {
                  articles.set(urls[i], titles[i]);
              }
          }

          if (articles.size === 0) {
              console.log('No articles found');
              process.exit(1);
          }
          let readme = fs.readFileSync('README.md', 'utf8');
          const start = '<!-- BLOG:START -->';
          const end = '<!-- BLOG:END -->';
          const items = [...articles.entries()];
          const top = items.slice(0, 3);
          const rest = items.slice(3);
          let newSection = start + '\n';
          for (const [url, title] of top) {
              const escapedTitle = title.replace(/\"/g, '&quot;');
              newSection += '- <a href=\"https://blog.iamsainikhil.com' + url + '\" target=\"_blank\" rel=\"noopener noreferrer\">' + escapedTitle + '</a>\n';
          }
          if (rest.length > 0) {
              newSection += '\n<details>\n  <summary>More articles</summary>\n  <ul>\n';
              for (const [url, title] of rest) {
                  const escapedTitle = title.replace(/\"/g, '&quot;');
                  newSection += '    <li><a href=\"https://blog.iamsainikhil.com' + url + '\" target=\"_blank\" rel=\"noopener noreferrer\">' + escapedTitle + '</a></li>\n';
              }
              newSection += '  </ul>\n</details>\n';
          }
          newSection += end;
          if (readme.includes(start) && readme.includes(end)) {
              readme = readme.replace(new RegExp(start + '[\\\\s\\\\S]*?' + end), newSection);
              fs.writeFileSync('README.md', readme);
              console.log('README updated with latest blog posts');
          } else {
              console.log('Blog markers not found in README. Add ' + start + ' and ' + end + ' comments to enable auto-updates.');
          }
          "
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --staged --exit-code || git commit -m "chore: update blog posts [skip ci]"
          git push
